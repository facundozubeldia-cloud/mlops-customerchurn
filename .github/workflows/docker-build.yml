name: Docker Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias para crear modelo de prueba
        run: pip install scikit-learn pandas numpy joblib

      - name: Crear modelo de prueba para el build
        run: |
          mkdir -p models
          python3 scripts/crear_modelo_prueba.py

      - name: Build imagen API
        run: docker build -f Dockerfile -t andeslink-api:test .

      - name: Build imagen Dashboard
        run: docker build -f Dockerfile.streamlit -t andeslink-dashboard:test .

      - name: Verificar que la API arranca
        run: |
          docker run -d --name test-api -p 8000:8000 andeslink-api:test
          sleep 8
          curl -f http://localhost:8000/ || (docker logs test-api && exit 1)
          docker stop test-api
